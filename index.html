<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>NodePlay — Server Overview</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Self-hosted Montserrat (variable woff2, latin + cyrillic) for deterministic rendering. */
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-cyrillic.woff2") format("woff2-variations"),
          url("assets/fonts/montserrat-cyrillic.woff2") format("woff2");
        font-weight: 300 800;
        font-style: normal;
        font-display: block;
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin.woff2") format("woff2-variations"),
          url("assets/fonts/montserrat-latin.woff2") format("woff2");
        font-weight: 300 800;
        font-style: normal;
        font-display: block;
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6,
          U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+2074, U+20AC,
          U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #19191b;
        color: #fff;
      }

      /* Soft ambient accent glow that lives across the whole piece */
      .ambient {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(60% 55% at 80% 10%, rgba(109, 40, 217, 0.28) 0%, transparent 70%),
          radial-gradient(50% 45% at 12% 95%, rgba(109, 40, 217, 0.18) 0%, transparent 75%);
        will-change: opacity;
      }

      /* Canvas = the 1914×855 frame of the product page, centered on the 1920×1080 stage */
      .stage {
        position: absolute;
        left: 3px;
        top: 112px;
        width: 1914px;
        height: 855px;
        will-change: transform, opacity;
        transform-origin: 50% 50%;
      }

      /* Dark dashboard "empty host" that the UI lands onto */
      .host {
        position: absolute;
        inset: 0;
        background: #19191b;
        border-radius: 0;
        box-shadow:
          0 80px 140px rgba(0, 0, 0, 0.55),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        will-change: opacity, transform;
      }
      /* Thin darker header-strip on the host (sits under the real header asset) */
      .host-header {
        position: absolute;
        left: 0;
        top: 0;
        width: 1914px;
        height: 64px;
        background: #111214;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        will-change: opacity;
      }

      /* Each UI piece is an <img>, absolutely positioned, animated independently */
      .layer {
        position: absolute;
        display: block;
        will-change: transform, opacity, filter;
        transform-origin: 50% 50%;
        /* subtle drop shadow to give Fluent Mica "floating" feel */
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.35));
      }
      /* Wallpaper sits underneath everything, softened */
      .wallpaper {
        position: absolute;
        left: 0;
        top: 0;
        width: 1914px;
        height: 855px;
        opacity: 1;
        will-change: opacity, transform;
        filter: none;
      }
      /* Cards have a stronger shadow */
      .layer.card {
        filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 0 1px rgba(255, 255, 255, 0.02));
      }

      /* Lower-third caption */
      .caption {
        position: absolute;
        left: 80px;
        bottom: 80px;
        z-index: 50;
      }
      .caption-inner {
        will-change: transform, opacity;
      }
      .caption .kicker {
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.3em;
        color: #c9b9ff;
        text-transform: uppercase;
        margin-bottom: 14px;
      }
      .caption .title {
        font-family: "Montserrat", sans-serif;
        font-weight: 700;
        font-size: 52px;
        letter-spacing: -0.01em;
        color: #ffffff;
      }
      .caption .title .em {
        background: linear-gradient(180deg, #ffffff 0%, #c9b9ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      /* Top-right brand watermark */
      .watermark {
        position: absolute;
        top: 44px;
        right: 72px;
        z-index: 50;
      }
      .watermark-inner {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: "Montserrat", sans-serif;
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
        will-change: transform, opacity;
      }
      .watermark-inner .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #6d28d9;
        box-shadow: 0 0 16px rgba(109, 40, 217, 0.8);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="root"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <!-- Always-on ambient glow -->
      <div
        id="ambient"
        class="ambient clip"
        data-start="0"
        data-duration="14"
        data-track-index="0"
      ></div>

      <!-- Product page stage (clip) — visible from t=0 to the end -->
      <div
        id="stage"
        class="stage clip"
        data-start="0"
        data-duration="14"
        data-track-index="1"
      >
        <!-- 1) Empty host (dashboard frame) -->
        <div class="host" id="host"></div>
        <div class="host-header" id="hostHeader"></div>

        <!-- 2) Wallpaper (behind everything) -->
        <img
          class="wallpaper"
          id="wallpaper"
          src="assets/images/layers/server+overview.png"
          alt=""
        />

        <!-- 3) Header (logo + search + user chip) -->
        <img
          class="layer"
          id="l_header"
          src="assets/images/layers/header.h-16.png"
          alt=""
          style="left: 0; top: 0; width: 1914px; height: 64px;"
        />

        <!-- 4) Left sidebar nav + "Мой план" card -->
        <img
          class="layer"
          id="l_sidebar"
          src="assets/images/layers/div.sidebar-column_margin.png"
          alt=""
          style="left: 0; top: 96px; width: 240px; height: 721px;"
        />

        <!-- 5) Top stat bars (ОЗУ / ЦПУ / ДИСК / network) -->
        <img
          class="layer"
          id="l_stats"
          src="assets/images/layers/div.flex.png"
          alt=""
          style="left: 296px; top: 128px; width: 1488px; height: 30px;"
        />

        <!-- 6) Server toolbar (Barotrauma header row with actions) -->
        <img
          class="layer"
          id="l_serverbar"
          src="assets/images/layers/div.hidden.png"
          alt=""
          style="left: 296px; top: 186px; width: 1248px; height: 72px;"
        />

        <!-- 7) "Обзор" section title + description -->
        <img
          class="layer"
          id="l_overview"
          src="assets/images/layers/div.png"
          alt=""
          style="left: 296px; top: 286px; width: 1248px; height: 56px;"
        />

        <!-- 8) "Информация о сервере" card -->
        <img
          class="layer card"
          id="l_card_info"
          src="assets/images/layers/div.card.png"
          alt=""
          style="left: 296px; top: 374px; width: 616px; height: 387px;"
        />

        <!-- 9) "Производительность сервера" chart card -->
        <img
          class="layer card"
          id="l_card_perf"
          src="assets/images/layers/div.card2.png"
          alt=""
          style="left: 928px; top: 374px; width: 616px; height: 387px;"
        />
      </div>

      <!-- Lower-third caption -->
      <div
        id="caption"
        class="caption clip"
        data-start="0"
        data-duration="14"
        data-track-index="10"
      >
        <div class="caption-inner" id="captionInner">
          <div class="kicker">Server Overview</div>
          <div class="title">
            Контроль до <span class="em">мелочей</span>
          </div>
        </div>
      </div>

      <!-- Top-right watermark -->
      <div
        id="watermark"
        class="watermark clip"
        data-start="0"
        data-duration="14"
        data-track-index="11"
      >
        <div class="watermark-inner" id="watermarkInner">
          <span class="dot"></span>
          <span>NodePlay · Control panel</span>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Fluent decelerate — Microsoft Designer "landing" easing
      const FLUENT_EASE = "cubic-bezier(0.16, 1, 0.3, 1)";
      gsap.defaults({ ease: FLUENT_EASE });

      const tl = gsap.timeline({
        paused: true,
        defaults: { ease: FLUENT_EASE },
      });

      // Every layer pre-hidden at t=0
      const LAYERS = [
        { id: "#wallpaper",    x:   0, y:   0, scale: 1.08, dur: 1.1, at: 0.4, ease: "sine.out" },
        { id: "#hostHeader",   x:   0, y: -30, scale: 1.00, dur: 0.65, at: 0.55 },
        { id: "#l_header",     x:   0, y: -60, scale: 1.00, dur: 0.8,  at: 0.70 },
        { id: "#l_sidebar",    x: -80, y:  20, scale: 0.97, dur: 0.85, at: 0.85 },
        { id: "#l_stats",      x:   0, y: -40, scale: 0.97, dur: 0.8,  at: 1.00 },
        { id: "#l_serverbar",  x:  60, y:   0, scale: 0.96, dur: 0.85, at: 1.15 },
        { id: "#l_overview",   x: -40, y:  20, scale: 0.97, dur: 0.75, at: 1.30 },
        { id: "#l_card_info",  x: -30, y:  80, scale: 0.94, dur: 0.95, at: 1.45 },
        { id: "#l_card_perf",  x:  30, y:  80, scale: 0.94, dur: 0.95, at: 1.58 },
      ];

      // Ambient + caption + watermark (inner) pre-hide
      tl.set(
        LAYERS.map((l) => l.id).concat([
          "#host",
          "#hostHeader",
          "#captionInner",
          "#watermarkInner",
          "#ambient",
          "#stage",
        ]),
        { opacity: 0 },
        0,
      );

      // Ambient glow gently fades in first
      tl.to("#ambient", { opacity: 1, duration: 1.0, ease: "sine.out" }, 0.0);

      // Stage frame fades in (subtle scale)
      tl.fromTo(
        "#stage",
        { opacity: 0, scale: 1.03, y: 12 },
        { opacity: 1, scale: 1, y: 0, duration: 0.9, ease: "sine.out" },
        0.05,
      );

      // Empty host (dashboard background)
      tl.fromTo(
        "#host",
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "sine.out" },
        0.1,
      );

      // Each UI layer lands independently — Microsoft Designer / Fluent style
      LAYERS.forEach((l) => {
        tl.fromTo(
          l.id,
          {
            opacity: 0,
            x: l.x,
            y: l.y,
            scale: l.scale,
            rotation: l.x < 0 ? -1.5 : l.x > 0 ? 1.5 : 0,
          },
          {
            opacity: 1,
            x: 0,
            y: 0,
            scale: 1,
            rotation: 0,
            duration: l.dur,
            ease: l.ease || FLUENT_EASE,
          },
          l.at,
        );
      });

      // Caption slides up from below (animate inner so clip-system still owns the wrapper)
      tl.fromTo(
        "#captionInner",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" },
        2.1,
      );

      // Watermark softly appears
      tl.fromTo(
        "#watermarkInner",
        { opacity: 0, y: -8 },
        { opacity: 1, y: 0, duration: 0.8, ease: "sine.out" },
        2.3,
      );

      // Idle polish — gentle drift on the whole stage so the frame stays alive
      tl.fromTo(
        "#stage",
        { y: 0 },
        { y: -10, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: 1 },
        3.5,
      );

      // Outro — stage gently drifts up & fades, caption fades first
      tl.to(
        "#captionInner",
        { opacity: 0, x: -30, duration: 0.6, ease: "power2.in" },
        12.5,
      );
      tl.set("#captionInner", { opacity: 0 }, 13.15);
      tl.to(
        "#watermarkInner",
        { opacity: 0, duration: 0.6, ease: "power2.in" },
        12.7,
      );
      tl.set("#watermarkInner", { opacity: 0 }, 13.35);
      tl.to(
        "#stage",
        { opacity: 0, scale: 1.02, y: -14, duration: 1.1, ease: "power2.in" },
        12.7,
      );
      tl.to("#ambient", { opacity: 0, duration: 0.8, ease: "sine.in" }, 13.1);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
